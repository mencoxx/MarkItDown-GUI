name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build executable
        shell: cmd
        run: build.bat

      - name: Create ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          } else {
            $version = "dev-" + "$env:GITHUB_SHA".Substring(0, 7)
          }

          $zipName = "MarkItDownConverter-$version-Windows-x64.zip"
          Compress-Archive -Path "dist\MarkItDownConverter.exe" -DestinationPath "dist\$zipName" -Force

          $hash = (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content "dist\SHA256SUMS.txt" -Encoding ascii

          "PACKAGE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDownConverter-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach files to GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist\$env:PACKAGE_ZIP" "dist\SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag "dist\$env:PACKAGE_ZIP" "dist\SHA256SUMS.txt" --verify-tag --generate-notes --title "MarkItDown Converter $tag"
          }
